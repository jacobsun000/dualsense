[package]
name = "dualsense"
version = "0.1.0"
edition = "2024"

[features]
default = ["tui", "voice"]
tui = [
    "dep:crossterm",
    "dep:ratatui",
    "dep:serde",
]
voice = [
    "dep:base64",
    "dep:cpal",
    "dep:futures-util",
    "dep:libc",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:rustls",
    "dep:wrtype",
    "dep:wl-clipboard-rs",
]

[dependencies]
dotenvy = "0.15"
base64 = { version = "0.23", optional = true }
cpal = { version = "0.15.3", optional = true }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
libc = { version = "0.2", optional = true }
evdev = "0.13.2"
crossterm = { version = "0.29.0", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = "1.0"
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.0", optional = true, features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
wrtype = { version = "0.1", optional = true }
wl-clipboard-rs = { version = "0.9", optional = true }
